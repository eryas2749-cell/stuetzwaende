  var r=roll();if(r!=null)p.push("Neigung "+Math.abs(r).toFixed(1).replace(".",",")+"°");
  if(CAM.heading!=null){var rf=S.refMeta&&S.refMeta[CAM.visit&&S.visits[CAM.visit]&&S.visits[CAM.visit].bw];p.push("Richtung "+Math.round(CAM.heading)+"°"+(rf&&rf.heading!=null?" (Vgl. "+Math.round(rf.heading)+"°)":""))}
  $("hud").textContent=p.join(" · ")}
function shoot(){
  var v=$("vid"),x=S.visits[CAM.visit];if(!CAM.stream||!v.videoWidth){toast("Kamera startet noch …");return}
  var meta={lat:S.pos&&S.pos.lat||null,lon:S.pos&&S.pos.lon||null,acc:S.pos&&Math.round(S.pos.acc)||null,heading:CAM.heading!=null?Math.round(CAM.heading):null,neigung:roll()!=null?+roll().toFixed(1):null};
  $("cam").style.opacity=.4;setTimeout(function(){$("cam").style.opacity=1},90);
  toJpeg(v,v.videoWidth,v.videoHeight,1920,0.8).then(function(bl){return addFoto(x,bl,meta)}).then(function(){$("camCount").textContent=x.fotos.length+" Fotos"});
}

/* ---------- Sprachaufnahme ---------- */
function recToggle(id){
  if(S.rec){S.rec.stop();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){toast("Sprachaufnahme wird auf diesem Gerät nicht unterstützt.");return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
    var mime=["audio/mp4","audio/webm;codecs=opus","audio/webm"].filter(function(m){return MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m)})[0]||"";
    var r=new MediaRecorder(st,mime?{mimeType:mime}:{}),parts=[],t0=Date.now();S.rec=r;S.recSec=0;
    S.recTimer=setInterval(function(){S.recSec=Math.round((Date.now()-t0)/1000);var b=document.querySelector('[data-act="rec"]');if(b)b.textContent="Aufnahme beenden ("+S.recSec+" s)"},1000);
    r.ondataavailable=function(e){if(e.data.size)parts.push(e.data)};
    r.onstop=function(){clearInterval(S.recTimer);st.getTracks().forEach(function(t){t.stop()});S.rec=null;
      var bl=new Blob(parts,{type:r.mimeType||mime||"audio/webm"}),x=S.visits[id],key="audio_"+id+"_"+Date.now();
      putBlob(key,bl).then(function(){x.audios.push({key:key,zeit:hm(),dauer:Math.round((Date.now()-t0)/1000),mime:bl.type});return save(x)}).then(render)};
    r.start();render();
  }).catch(function(){toast("Mikrofon nicht erlaubt.")});
}

/* ---------- Diktat (Spracherkennung des Browsers) ---------- */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;S.speech=!!SR;
function dictToggle(id,k){
  if(S.dict){var same=S.dict.visit===id&&S.dict.k===k;S.dict.rec.stop();S.dict=null;render();if(same)return}
  var x=S.visits[id],r=new SR();r.lang="de-DE";r.continuous=true;r.interimResults=false;
  r.onresult=function(e){for(var i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal){var t=e.results[i][0].transcript.trim();if(!t)continue;
    t=t.charAt(0).toUpperCase()+t.slice(1);x[k]=(x[k]?x[k].replace(/\s+$/,"")+(/[.;:!?]$/.test(x[k].trim())?" ":"; "):"")+t;save(x);var ta=$("t_"+k);if(ta)ta.value=x[k]}};
  r.onend=function(){if(S.dict&&S.dict.rec===r){S.dict=null;render()}};
  r.onerror=function(e){toast(e.error==="not-allowed"?"Mikrofon nicht erlaubt.":"Diktat beendet.");};
  S.dict={visit:id,k:k,rec:r};r.start();render();
}

/* ---------- Protokoll (.xlsm) aus Vorlage ---------- */
function fotoName(x,i){return x.datum+"_Besichtigung_"+pad(i+1)+".jpg"}
function protName(x,b){return b.nr+" Besichtigungsprotokoll "+x.datum.slice(0,4)+".xlsm"}
function xe(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function serial(iso){var p=String(iso).slice(0,10).split("-");return Math.round((Date.UTC(+p[0],p[1]-1,+p[2])-Date.UTC(1899,11,30))/86400000)}
function setCell(xml,ref,kind,val){var re=new RegExp('<c r="'+ref+'"([^>]*?)(/>|>[\\s\\S]*?</c>)'),m=xml.match(re);if(!m)return xml;var at=m[1].replace(/\s*t="[^"]*"/,""),c;
  if(kind==="n")c='<c r="'+ref+'"'+at+"><v>"+val+"</v></c>";else if(kind==="s")c='<c r="'+ref+'"'+at+' t="s"><v>'+val+"</v></c>";else c='<c r="'+ref+'"'+at+' t="inlineStr"><is><t xml:space="preserve">'+xe(val)+"</t></is></c>";return xml.replace(re,c)}
function setBox(d,name,text){var parts=d.split("</xdr:twoCellAnchor>");for(var k=0;k<parts.length;k++){if(parts[k].indexOf('name="'+name+'"')<0)continue;
  parts[k]=parts[k].replace(/(<xdr:txBody>[\s\S]*?<a:lstStyle\/>)([\s\S]*?)(<\/xdr:txBody>)/,function(all,head,body,tail){var p=(body.match(/<a:p>[\s\S]*?<\/a:p>/)||["<a:p></a:p>"])[0],pPr=(p.match(/<a:pPr\b[^>]*\/>|<a:pPr\b[\s\S]*?<\/a:pPr>/)||[""])[0];
    var rPr='<a:rPr lang="de-DE" sz="1100" baseline="0"><a:latin typeface="Calibri" panose="020F0502020204030204" pitchFamily="34" charset="0"/></a:rPr>';
    var lines=String(text||"").split(/\n|;\s*/).map(function(s){return s.trim()}).filter(Boolean);
    return head+(lines.length?lines.map(function(l){return "<a:p>"+pPr+"<a:r>"+rPr+"<a:t>"+xe(l)+"</a:t></a:r></a:p>"}).join(""):"<a:p>"+pPr+'<a:endParaRPr lang="de-DE" sz="1100"/></a:p>')+tail})}return parts.join("</xdr:twoCellAnchor>")}
var VORLAGE=null;
function buildProtokoll(x,b){
  return (VORLAGE?Promise.resolve(VORLAGE):fetch("vorlage.xlsm").then(function(r){if(!r.ok)throw new Error("Vorlage fehlt");return r.arrayBuffer()}).then(function(a){VORLAGE=a;return a})).then(function(buf){return JSZip.loadAsync(buf.slice(0))}).then(function(z){
    return Promise.all(["xl/worksheets/sheet1.xml","xl/drawings/drawing1.xml","xl/workbook.xml","xl/worksheets/sheet2.xml"].map(function(p){return z.file(p).async("string")})).then(function(a){
      var s=a[0],d=a[1],w=a[2],s2=a[3],nr=parseInt(b.nr.replace(/\D/g,""),10);
      s=setCell(s,"C11","n",nr);s=setCell(s,"F11","str",b.name);s=setCell(s,"K11","n",+x.datum.slice(0,4));s=setCell(s,"F12","str",b.eigentum||"");
      s=setCell(s,"E16","n",serial(x.datum));s=setCell(s,"H16","str",x.pruefer);
      for(var n=0;n<18;n++){var r=18+2*n;s=setCell(s,"J"+r,"s",x.ja[n]?62:30);s=setCell(s,"L"+r,"s",x.ja[n]?30:62)}
      s=setCell(s,"J61","s",x.sonder?62:30);s=setCell(s,"L61","s",x.sonder?30:62);s=setCell(s,"B66","n",serial(today()));
      var sch=x.schaden||"";if(x.befund==="keine Schadenserweiterung"&&x.basis)sch=(sch?sch+"\n":"")+"Keine Schadenserweiterung gegenüber der Besichtigung vom "+deDate(x.basis);
      d=setBox(d,"Textfeld 1",x.verunreinigungen);d=setBox(d,"Textfeld 4",sch);d=setBox(d,"Textfeld 3",x.sonstige);
      if(!/fullCalcOnLoad/.test(w))w=w.replace(/<calcPr\b/,'<calcPr fullCalcOnLoad="1"');
      s2=s2.replace(/(<c r="A(?:48|97|146|195|244|293|342|391|440)"[^>]*>(?:<f[^>]*\/>|<f[^>]*>[^<]*<\/f>))<v>[^<]*<\/v>/g,"$1<v>"+serial(today())+"</v>").replace(/(<c r="C(?:48|97|146|195|244|293|342|391|440)"[^>]*>(?:<f[^>]*\/>|<f[^>]*>[^<]*<\/f>))<v>[^<]*<\/v>/g,"$1<v>"+nr+"</v>");
      z.file("xl/worksheets/sheet1.xml",s);z.file("xl/drawings/drawing1.xml",d);z.file("xl/workbook.xml",w);z.file("xl/worksheets/sheet2.xml",s2);
      return z.generateAsync({type:"blob",compression:"DEFLATE",mimeType:"application/vnd.ms-excel.sheet.macroEnabled.12"});
    })});
}
function exportFiles(x,what){
  var b=BW[x.bw],jobs=[];
  if(what!=="fotos")jobs.push(buildProtokoll(x,b).then(function(bl){return new File([bl],protName(x,b),{type:"application/vnd.ms-excel.sheet.macroEnabled.12"})}));
  if(what!=="prot")x.fotos.forEach(function(f,i){jobs.push(getBlob(f.key).then(function(bl){return new File([bl],fotoName(x,i),{type:"image/jpeg"})}))});
  return Promise.all(jobs);
}
function download(file){var a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000)}
function dlAll(files){files.forEach(function(f,i){setTimeout(function(){download(f)},i*350)})}
function prep(x){S.files=S.files||{};if(!S.files[x.id])S.files[x.id]=exportFiles(x,"alles");return S.files[x.id]}
function share(x){
  prep(x).then(function(files){
    if(navigator.canShare&&navigator.canShare({files:files}))return navigator.share({files:files,title:BW[x.bw].nr+" Besichtigung "+deDate(x.datum)}).catch(function(e){if(e&&e.name!=="AbortError")throw e});
    // .xlsm wird von manchen Geräten nicht geteilt: dann Fotos teilen und Protokoll laden
    var fotos=files.filter(function(f){return /\.jpg$/.test(f.name)});
    if(fotos.length&&navigator.canShare&&navigator.canShare({files:fotos})){download(files[0]);return navigator.share({files:fotos}).catch(function(){})}
    dlAll(files);toast("Teilen nicht möglich – Dateien werden heruntergeladen.");
  }).catch(function(e){toast("Fehler: "+(e&&e.message||e))});
}
function dlZip(x){var b=BW[x.bw];exportFiles(x,"alles").then(function(files){var z=new JSZip(),dir=z.folder(b.nr+"_"+x.datum+"_Besichtigung");files.forEach(function(f){dir.file(f.name,f)});return z.generateAsync({type:"blob"})}).then(function(bl){download(new File([bl],b.nr+"_"+x.datum+"_Besichtigung.zip"))}).catch(function(e){toast("Fehler: "+(e&&e.message||e))})}

/* ---------- Ereignisse ---------- */
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act]");if(!el)return;var a=el.dataset.act,id=el.dataset.visit,x=id&&S.visits[id];
  if(a==="palette"){var p=$("pal");p.hidden=!p.hidden;el.setAttribute("aria-expanded",String(!p.hidden));return}
  if(a==="setbg"){S.bg=el.dataset.v;document.documentElement.setAttribute("data-bg",S.bg);lss("bg",S.bg);markPal();return}
  if(a==="theme"){var cur=document.documentElement.getAttribute("data-theme"),dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches,nt=dark?"light":"dark";document.documentElement.setAttribute("data-theme",nt);lss("theme",nt);return}
  if(a==="mode"){S.mode=el.dataset.m;render();return}
  if(a==="gps"){startGps();render();return}
  if(a==="start"){startVisit(el.dataset.bw);return}
  if(a==="setCoord"&&S.pos){var b=BW[el.dataset.bw];b.lat=S.pos.lat;b.lon=S.pos.lon;S.coords[b.id]=[b.lat,b.lon];lss("coords",S.coords);toast("Position gespeichert (± "+Math.round(S.pos.acc)+" m)");render();return}
  if(a==="star"){var bw=el.dataset.bw,k=el.dataset.key;S.refs[bw]=S.refs[bw]===k?null:k;lss("refs",S.refs);var f=null;Object.keys(S.visits).forEach(function(v){S.visits[v].fotos.forEach(function(ff){if(ff.key===k)f=ff})});S.refMeta=S.refMeta||{};S.refMeta[bw]=f;lss("refMeta",S.refMeta);toast(S.refs[bw]?"Als Vergleichsbild gespeichert":"Vergleichsbild entfernt");render();return}
  if(a==="camOpen"){camOpen(id);return}
  if(a==="camClose"){camClose();return}
  if(a==="shoot"){shoot();return}
  if(a==="ctag"){S.tag=el.dataset.t;document.querySelectorAll("#ctags button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.t===S.tag))});return}
  if(a==="refToggle"){var ri=$("refimg");ri.hidden=!ri.hidden;$("opWrap").hidden=ri.hidden;return}
  if(!x)return;
  if(a==="pp"){var i=+el.dataset.i;x.ja[i]=!x.ja[i];save(x);render();return}
  if(a==="sonder"){x.sonder=!x.sonder;save(x);render();return}
  if(a==="reset"){x.ja=x.ref.slice();x.sonder=false;save(x);render();return}
  if(a==="rec"){recToggle(id);return}
  if(a==="dict"){dictToggle(id,el.dataset.k);return}
  if(a==="finish"){if(S.dict){S.dict.rec.stop();S.dict=null}var same=x.ja.every(function(v,i){return v===x.ref[i]})&&!x.sonder;x.status="abgeschlossen";x.befund=same?"keine Schadenserweiterung":"Veränderung festgestellt";save(x).then(function(){render();scrollTo({top:document.body.scrollHeight,behavior:"smooth"})});return}
  if(a==="reopen"){x.status="in Arbeit";save(x);render();return}
  if(a==="share"){share(x);return}
  if(a==="dlProt"){exportFiles(x,"prot").then(dlAll).catch(function(e){toast("Fehler: "+e.message)});return}
  if(a==="dlFotos"){exportFiles(x,"fotos").then(dlAll);return}
  if(a==="dlZip"){dlZip(x);return}
  if(a==="delVisit"){if(el.dataset.sure!=="1"){el.dataset.sure="1";el.textContent="Wirklich löschen? Nochmal tippen";return}
    Promise.all(x.fotos.map(function(f){return delBlob(f.key)}).concat(x.audios.map(function(f){return delBlob(f.key)}))).then(function(){return delVisit(x.id)}).then(function(){delete S.visits[x.id];render()});return}
});
document.addEventListener("change",function(ev){
  var el=ev.target;
  if(el.matches("textarea[data-k]")){var x=S.visits[el.dataset.visit];if(x){x[el.dataset.k]=el.value;save(x)}return}
  if(el.dataset.gal&&el.files.length){var x2=S.visits[el.dataset.gal],fs=Array.from(el.files);el.value="";
    fs.reduce(function(p,f){return p.then(function(){return fileToJpeg(f).then(function(bl){return addFoto(x2,bl,{quelle:"Galerie"})})})},Promise.resolve()).then(render);return}
  if(el.dataset.ref&&el.files[0]){var bw=el.dataset.ref,f=el.files[0];el.value="";fileToJpeg(f).then(function(bl){var k="ref_"+bw;return putBlob(k,bl).then(function(){S.refs[bw]=k;lss("refs",S.refs);delete S.urls[k];toast("Vergleichsbild gespeichert");render()})});return}
});
