<script src="jszip.min.js"></script>
<script>
"use strict";
var APPVER="0.3";
var PP=["Außergew. Veränderungen","Verschiebungen am Bauwerk","Verkehrssicherheit gegeben","Bewuchs","Risse","Schäden Stützwandfuß","Mauerwerk (Verband)","Mauerwerk (Steinschäden)","Mauerwerk (Fugenmörtel)","Beton (Abplatzungen)","Beton (Aussinterungen)","Beton (dauerelast. Fugen)","Beton (freiliegende Bew.)","Kopfbalken / Mauerkrone","Abdeckung","Absturzsicherung / Zaun","Treppen / -wangen","sonstige Mängel / Auffälligkeiten"];
var TAGS=["Übersicht","4 Bewuchs","5 Risse","6 Wandfuß","8 Steine","9 Fugen","14 Mauerkrone","15 Abdeckung","16 Zaun","17 Treppen","Graffiti","18 Sonstiges"];
var BGS=[["nebel","Nebel","#7FA3D9","#B9A2E3","#3F6390"],["salbei","Salbei","#7DBF8E","#E3D27F","#3E6A52"],["sand","Sand","#F0A877","#E8938F","#8E4F37"],["lavendel","Lavendel","#A894EE","#EE9CC6","#5A4B93"],["graphit","Graphit","#9AA6B6","#C4BDB2","#36424F"]];
function ja(list){var a=[];for(var i=1;i<=18;i++)a.push(list.indexOf(i)>=0);return a}
var SEED=[
  {id:"M201",nr:"M 201",bezirk:"2",name:"Georg-Stock-Platz",adresse:"Georg-Stock-Platz, Kassel",eigentum:"",lat:51.30937,lon:9.46873,
    hinweise:["Zuständigkeit liegt bei -23-, nur EP"],letzte:{datum:"2026-09-11",pruefer:"Dogan",ja:ja([3,5,8,9,15]),verunreinigungen:"",schaden:"",sonstige:""}},
  {id:"M202",nr:"M 202",bezirk:"2",name:"Bosestraße",adresse:"Bosestraße, Kassel",eigentum:"Fremd",lat:null,lon:null,
    hinweise:["Nr. 2 Verschiebungen: 2026 nicht bestätigt – vor Ort prüfen","Teil abgeschnitten (Baustelleneinfahrt): Länge prüfen","Sandstein: Fotobefund unsicher"],
    letzte:{datum:"2026-09-11",pruefer:"Dogan",ja:ja([1,2,3,4,8,9,18]),verunreinigungen:"Graffiti, geringfügig, an Wandansicht",
      schaden:"Bewuchs auf der Mauerkrone (Efeu/Gehölz); Fugenmörtel bereichsweise geschädigt; Kleinere Steinschäden, bereichsweise; Verschiebungen am Mauerwerk (siehe Protokoll 2025)",
      sonstige:"Ein Teil des Bauwerks wurde abgeschnitten; die Lücke wird als Baustelleneinfahrt genutzt (angrenzende Neubaumaßnahme, Bauzaun). Pfeiler am Wandende: Klinkerverblendung ausgebrochen."}}
];

/* ---------- Hilfen ---------- */
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pad(n){return String(n).padStart(2,"0")}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function deDate(i){if(!i)return "–";var p=String(i).slice(0,10).split("-");return p[2]+"."+p[1]+"."+p[0]}
function hm(d){d=d||new Date();return pad(d.getHours())+":"+pad(d.getMinutes())}
function ls(k,d){try{var v=localStorage.getItem("bb_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lss(k,v){try{localStorage.setItem("bb_"+k,JSON.stringify(v))}catch(e){}}
function toast(t,ms){var el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true},ms||2600)}
function maps(dest,mode){return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(dest)+"&travelmode="+(mode||"driving")}
function dist(a,b,c,d){var R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(h))}
function fmtDist(m){return m<1000?Math.round(m/10)*10+" m":(m/1000).toFixed(1).replace(".",",")+" km"}
function natCmp(a,b){return String(a).localeCompare(String(b),"de",{numeric:true})}

/* ---------- Einstellungen ---------- */
var SET=Object.assign({pruefer:"Dogan",fotoName:"datum",protFormat:"xlsx",fotoMax:1920,mode:"driving",glas:"klar",hgFoto:false,reflex:true},ls("settings",{}));
function saveSet(){lss("settings",SET)}

/* ---------- Speicher (IndexedDB, nur auf diesem Gerät) ---------- */
var DB=null;
function dbOpen(){return new Promise(function(res,rej){var r=indexedDB.open("besichtigung-demo",2);
  r.onupgradeneeded=function(){var d=r.result;["visits","bauwerke"].forEach(function(n){if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:"id"})});if(!d.objectStoreNames.contains("blobs"))d.createObjectStore("blobs")};
  r.onsuccess=function(){DB=r.result;res()};r.onerror=function(){rej(r.error)}})}
function tx(store,mode,fn){return new Promise(function(res,rej){var t=DB.transaction(store,mode),s=t.objectStore(store),out=fn(s);t.oncomplete=function(){res(out&&out.result!==undefined?out.result:out)};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)}})}
function put(store,v){return tx(store,"readwrite",function(s){return s.put(v)})}
function all(store){return tx(store,"readonly",function(s){return s.getAll()})}
function del(store,id){return tx(store,"readwrite",function(s){return s.delete(id)})}
function putBlob(k,b){return tx("blobs","readwrite",function(s){return s.put(b,k)})}
function getBlob(k){return tx("blobs","readonly",function(s){return s.get(k)})}
function delBlob(k){return tx("blobs","readwrite",function(s){return s.delete(k)})}
function allBlobKeys(){return tx("blobs","readonly",function(s){return s.getAllKeys()})}

/* ---------- Zustand ---------- */
var S={bw:{},visits:{},tag:"Übersicht",pos:null,urls:{},rec:null,dict:null,q:"",filter:"alle",bez:""};
var th=ls("theme",null);if(th)document.documentElement.setAttribute("data-theme",th);
S.bg=ls("bg","nebel");if(!BGS.some(function(b){return b[0]===S.bg}))S.bg="nebel";document.documentElement.setAttribute("data-bg",S.bg);
document.documentElement.setAttribute("data-glass",SET.glas);
function vid(bw){return bw+"_"+today()}
function saveV(v){S.visits[v.id]=v;if(S.files)delete S.files[v.id];return put("visits",v).catch(function(){toast("Speichern fehlgeschlagen – Speicherplatz prüfen.")})}
function saveB(b){S.bw[b.id]=b;return put("bauwerke",b).catch(function(){toast("Speichern fehlgeschlagen.")})}
function bwList(){return Object.keys(S.bw).map(function(k){return S.bw[k]})}
function year(){return today().slice(0,4)}
function doneThisYear(b){return !!(b.letzte&&String(b.letzte.datum).slice(0,4)===year())}
function hasMangel(b){return !!(b.letzte&&b.letzte.ja&&b.letzte.ja.some(function(x,i){return x&&i!==2}))}
function unsafe(b){return !!(b.letzte&&b.letzte.ja&&!b.letzte.ja[2])}
function visitsOf(bwId){return Object.keys(S.visits).map(function(k){return S.visits[k]}).filter(function(v){return v.bw===bwId}).sort(function(a,b){return b.datum.localeCompare(a.datum)})}

/* ---------- Liquid-Glass-Darstellung ---------- */
function applyLook(){
  var r=document.documentElement;r.setAttribute("data-glass",SET.glas);
  var fx=$("bgfx");
  if(SET.hgFoto)getBlob("hintergrund").then(function(bl){if(!bl){fx.classList.remove("foto");fx.style.backgroundImage="";return}
    if(S.hgUrl)URL.revokeObjectURL(S.hgUrl);S.hgUrl=URL.createObjectURL(bl);fx.style.backgroundImage="url("+S.hgUrl+")";fx.classList.add("foto")}).catch(function(){});
  else{fx.classList.remove("foto");fx.style.backgroundImage=""}
}
/* Lichtreflex: wandert mit der Neigung des Handys (oder mit der Maus am PC) */
var LX={raf:0,x:25,y:0,on:false};
function setLight(x,y){LX.x=x;LX.y=y;if(LX.raf)return;LX.raf=requestAnimationFrame(function(){LX.raf=0;var s=document.documentElement.style;s.setProperty("--lx",LX.x.toFixed(1)+"%");s.setProperty("--ly",LX.y.toFixed(1)+"%")})}
function onTilt(e){if(!SET.reflex||e.gamma==null)return;var g=Math.max(-40,Math.min(40,e.gamma)),b=Math.max(0,Math.min(90,e.beta||45));setLight(50+g*1.5,(b-45)*-1.2)}
function onPointer(e){if(!SET.reflex||e.pointerType==="touch")return;setLight(e.clientX/innerWidth*100,e.clientY/innerHeight*100-20)}
function startReflex(fromTap){
  if(!SET.reflex)return;
  window.addEventListener("pointermove",onPointer,{passive:true});
  if(!window.DeviceOrientationEvent||LX.on)return;
  if(typeof DeviceOrientationEvent.requestPermission==="function"){
    if(!fromTap)return; // iOS: Erlaubnis nur nach Antippen
    DeviceOrientationEvent.requestPermission().then(function(s){if(s==="granted"){LX.on=true;window.addEventListener("deviceorientation",onTilt,{passive:true})}}).catch(function(){});
  }else{LX.on=true;window.addEventListener("deviceorientation",onTilt,{passive:true})}
}
document.addEventListener("click",function once(){startReflex(true);document.removeEventListener("click",once,true)},true);

/* ---------- GPS ---------- */
function startGps(){
  if(!navigator.geolocation||S.gpsOn)return;S.gpsOn=true;
  navigator.geolocation.watchPosition(function(p){S.pos={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};updHud();if(view().name==="liste"&&!S.typing)renderSoon()},
    function(e){S.gpsErr=e.code===1?"Standort nicht erlaubt":"Kein GPS-Signal";S.gpsOn=false;updHud();renderSoon()},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}

/* ---------- Ansichten ---------- */
function view(){var h=location.hash.replace("#","");
  if(h.indexOf("bw-")===0&&S.bw[h.slice(3)])return {name:"bw",id:h.slice(3)};
  if(h.indexOf("edit-")===0&&S.bw[h.slice(5)])return {name:"edit",id:h.slice(5)};
  if(h==="neu")return {name:"edit",id:null};
  if(h==="liste"||h==="einst")return {name:h};
  return {name:"start"}}
var rq=0;function renderSoon(){if(rq)return;rq=setTimeout(function(){rq=0;var a=document.activeElement;if(a&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&a.type!=="range"&&a.type!=="file"))){a.addEventListener("blur",renderSoon,{once:true});return}render()},40)}
function render(){
  var v=view(),n=v.name==="bw"||v.name==="edit"?"liste":v.name;
  $("nStart").setAttribute("aria-current",n==="start"?"page":"false");$("nListe").setAttribute("aria-current",n==="liste"?"page":"false");$("nEinst").setAttribute("aria-current",n==="einst"?"page":"false");
  $("app").innerHTML=v.name==="bw"?viewBw(S.bw[v.id]):v.name==="edit"?viewEdit(v.id?S.bw[v.id]:null):v.name==="liste"?viewListe():v.name==="einst"?viewEinst():viewStart();
  hydrate();
  if(v.name==="bw"){var xv=S.visits[vid(v.id)];if(xv&&xv.status==="abgeschlossen")prep(xv).catch(function(){})}
}
function lastChips(j){if(!j)return '<span class="chip">Noch keine Besichtigung</span>';var h="";if(!j[2])h+='<span class="chip bad">3 Nicht verkehrssicher</span>';j.forEach(function(x,i){if(x&&i!==2)h+='<span class="chip warn">'+(i+1)+" "+esc(PP[i])+"</span>"});return h||'<span class="chip ok">Ohne Befund</span>'}

/* Übersicht / Dashboard */
function viewStart(){
  var list=bwList(),y=year(),done=list.filter(doneThisYear).length,offen=list.length-done,mang=list.filter(hasMangel).length,uns=list.filter(unsafe).length;
  var running=Object.keys(S.visits).map(function(k){return S.visits[k]}).filter(function(v){return v.status!=="abgeschlossen"});
  var pct=list.length?Math.round(done/list.length*100):0;
  var h='<section class="glass panel"><span class="eyebrow">'+deDate(today())+" · "+esc(SET.pruefer)+'</span><h2>Übersicht '+y+'</h2>'+
    '<div class="row between small"><span>'+done+" von "+list.length+" Bauwerken besichtigt</span><b>"+pct+' %</b></div><div class="bar"><i style="width:'+pct+'%"></i></div></section>';
  h+='<div class="tiles">'+
    '<a class="tile glass" href="#liste" data-act="filt" data-f="alle"><b>'+list.length+'</b><span class="muted small">Bauwerke</span></a>'+
    '<a class="tile glass" href="#liste" data-act="filt" data-f="offen"><b>'+offen+'</b><span class="muted small">offen '+y+'</span></a>'+
    '<a class="tile glass" href="#liste" data-act="filt" data-f="mangel"><b style="color:var(--warn)">'+mang+'</b><span class="muted small">mit Befund</span></a>'+
    '<a class="tile glass" href="#liste" data-act="filt" data-f="unsicher"><b style="color:'+(uns?"var(--bad)":"var(--ok)")+'">'+uns+'</b><span class="muted small">nicht verkehrssicher</span></a></div>';
  if(running.length)h+='<section class="glass panel"><h3>In Arbeit</h3>'+running.map(function(v){var b=S.bw[v.bw]||{nr:v.bw,name:""};return '<a class="row between" style="text-decoration:none;color:inherit;border-top:1px solid var(--line);padding-top:8px" href="#bw-'+esc(v.bw)+'"><span><b>'+esc(b.nr)+"</b> · "+esc(b.name)+'</span><span class="muted small">'+deDate(v.datum)+" · "+v.fotos.length+" Fotos</span></a>"}).join("")+"</section>";
  var bz={};list.forEach(function(b){var k=b.bezirk||"–";bz[k]=bz[k]||{n:0,d:0};bz[k].n++;if(doneThisYear(b))bz[k].d++});
  var keys=Object.keys(bz).sort(natCmp);
  if(keys.length)h+='<section class="glass panel"><h3>Fortschritt nach Bezirk</h3>'+keys.map(function(k){var o=bz[k],p=Math.round(o.d/o.n*100);return '<div style="display:flex;flex-direction:column;gap:4px"><div class="row between small"><span>Bezirk '+esc(k)+'</span><span class="muted">'+o.d+" / "+o.n+'</span></div><div class="bar"><i style="width:'+p+'%"></i></div></div>'}).join("")+"</section>";
  var last=Object.keys(S.visits).map(function(k){return S.visits[k]}).filter(function(v){return v.status==="abgeschlossen"}).sort(function(a,b){return (b.ende||b.datum).localeCompare(a.ende||a.datum)}).slice(0,5);
  h+='<section class="glass panel"><h3>Zuletzt abgeschlossen</h3>'+(last.length?last.map(function(v){var b=S.bw[v.bw]||{nr:v.bw,name:""};return '<a class="row between" style="text-decoration:none;color:inherit;border-top:1px solid var(--line);padding-top:8px" href="#bw-'+esc(v.bw)+'"><span><b>'+esc(b.nr)+"</b> · "+esc(b.name)+'</span><span class="chip '+(v.befund==="keine Schadenserweiterung"?"ok":"warn")+'">'+deDate(v.datum)+"</span></a>"}).join(""):'<span class="muted small">Noch keine Besichtigung abgeschlossen.</span>')+"</section>";
  return h;
}

/* Bauwerksliste mit Suche */
function filtered(){
  var q=S.q.trim().toLowerCase();
  return bwList().filter(function(b){
    if(q&&(b.nr+" "+b.name+" "+(b.adresse||"")+" bezirk "+(b.bezirk||"")).toLowerCase().indexOf(q)<0)return false;
    if(S.bez&&String(b.bezirk)!==S.bez)return false;
    if(S.filter==="offen")return !doneThisYear(b);
    if(S.filter==="erledigt")return doneThisYear(b);
    if(S.filter==="mangel")return hasMangel(b);
    if(S.filter==="unsicher")return unsafe(b);
    return true;
  }).map(function(b){return {b:b,d:S.pos&&b.lat!=null?dist(S.pos.lat,S.pos.lon,b.lat,b.lon):null}})
   .sort(function(a,b){return S.pos?((a.d==null)-(b.d==null)||(a.d||0)-(b.d||0)):natCmp(a.b.nr,b.b.nr)});
}
function viewListe(){
  var bez=Array.from(new Set(bwList().map(function(b){return String(b.bezirk||"")}).filter(Boolean))).sort(natCmp);
  var F=[["alle","Alle"],["offen","Offen"],["erledigt","Besichtigt"],["mangel","Mit Befund"],["unsicher","Nicht sicher"]];
  var h='<section class="glass panel"><div class="row between"><h2>Bauwerke</h2><a class="btn sm" href="#neu">+ Neues Bauwerk</a></div>'+
    '<input type="search" id="q" placeholder="Suchen: Nr., Straße, Bezirk" value="'+esc(S.q)+'" aria-label="Bauwerke suchen" autocomplete="off">'+
    '<div class="seg" role="group" aria-label="Filter">'+F.map(function(f){return '<button type="button" data-act="filt" data-f="'+f[0]+'" aria-pressed="'+(S.filter===f[0])+'">'+f[1]+"</button>"}).join("")+"</div>"+
    (bez.length>1?'<select id="bez" aria-label="Bezirk"><option value="">Alle Bezirke</option>'+bez.map(function(z){return '<option value="'+esc(z)+'" '+(S.bez===z?"selected":"")+">Bezirk "+esc(z)+"</option>"}).join("")+"</select>":"")+
    '<div class="row between"><span class="muted small">'+(S.pos?"Sortiert nach Entfernung (± "+Math.round(S.pos.acc)+" m)":S.gpsErr||"Sortiert nach Nummer")+'</span>'+(S.pos?"":'<button type="button" class="btn soft sm" data-act="gps">Nach Entfernung</button>')+"</div></section>";
  h+='<div id="results">'+resultsHtml()+"</div>";
  return h;
}
function resultsHtml(){
  var list=filtered();
  if(!list.length)return '<div class="glass empty">Keine Bauwerke gefunden.</div>';
  return list.map(function(o){var b=o.b,x=S.visits[vid(b.id)];
    return '<a class="card glass" href="#bw-'+esc(b.id)+'" style="margin-bottom:10px"><div class="main"><span class="nr">'+esc(b.nr)+(b.bezirk?" · BEZIRK "+esc(b.bezirk):"")+(o.d!=null?" · "+fmtDist(o.d):"")+'</span><span class="name">'+esc(b.name)+'</span><div class="chips">'+lastChips(b.letzte&&b.letzte.ja)+'</div><span class="muted small">'+(b.letzte?"Zuletzt "+deDate(b.letzte.datum):"Noch nicht besichtigt")+(x?" · heute "+(x.status==="abgeschlossen"?"abgeschlossen":"in Arbeit"):"")+'</span></div><span aria-hidden="true" class="muted">›</span></a>'}).join("");
}

/* Bauwerk anlegen / bearbeiten */
function viewEdit(b){
  var n=!b;b=b||{nr:"",name:"",bezirk:"",adresse:"",eigentum:"",laenge:"",hoehe:"",flaeche:"",hinweise:[]};

/* Bilder/Audio aus IndexedDB nachladen */
function hydrate(){
  document.querySelectorAll("img[data-key],audio[data-key]").forEach(function(el){
    var k=el.dataset.key;if(S.urls[k]){el.src=S.urls[k];return}
    getBlob(k).then(function(bl){if(!bl)return;S.urls[k]=URL.createObjectURL(bl);el.src=S.urls[k]});
  });
}
function blobUrl(k){if(S.urls[k])return Promise.resolve(S.urls[k]);return getBlob(k).then(function(bl){if(!bl)return null;S.urls[k]=URL.createObjectURL(bl);return S.urls[k]})}

  var v={id:vid(bwId),bw:bwId,datum:today(),pruefer:SET.pruefer,status:"in Arbeit",ref:l.ja.slice(),ja:l.ja.slice(),sonder:false,
    verunreinigungen:l.verunreinigungen||"",schaden:l.schaden||"",sonstige:l.sonstige||"",fotos:[],audios:[],basis:l.datum||"",basisLetzte:b.letzte||null,seq:0};
  saveV(v).then(render)}
function finishVisit(x){
  var same=x.ja.every(function(v,i){return v===x.ref[i]})&&!x.sonder;
  x.status="abgeschlossen";x.befund=same?"keine Schadenserweiterung":"Veränderung festgestellt";x.ende=new Date().toISOString();x.pruefer=SET.pruefer;
  var b=S.bw[x.bw];b.letzte={datum:x.datum,pruefer:x.pruefer,ja:x.ja.slice(),verunreinigungen:x.verunreinigungen,schaden:x.schaden,sonstige:x.sonstige};

function toJpeg(src,w,h,max,q){var s=Math.min(1,max/Math.max(w,h)),c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);
  c.getContext("2d").drawImage(src,0,0,c.width,c.height);return new Promise(function(r){c.toBlob(r,"image/jpeg",q)})}
function fileToJpeg(file,max){return createImageBitmap(file,{imageOrientation:"from-image"}).catch(function(){return createImageBitmap(file)}).then(function(bm){return toJpeg(bm,bm.width,bm.height,max||SET.fotoMax,0.8)})}
function addFoto(x,blob,meta){
  x.seq=(x.seq||0)+1;var key="foto_"+x.id+"_"+x.seq+"_"+Date.now();
  return putBlob(key,blob).then(function(){x.fotos.push(Object.assign({key:key,tag:S.tag,zeit:hm(),ts:new Date().toISOString()},meta||{}));return saveV(x)});
}

  if(a==="setTheme"){var v=el.dataset.v;if(v==="auto"){document.documentElement.removeAttribute("data-theme");lss("theme",null)}else{document.documentElement.setAttribute("data-theme",v);lss("theme",v)}render();return}
  if(a==="setbg"){S.bg=el.dataset.v;document.documentElement.setAttribute("data-bg",S.bg);lss("bg",S.bg);render();return}
  if(a==="setOpt"){var k=el.dataset.k,val=el.dataset.v;SET[k]=k==="fotoMax"?+val:val;saveSet();S.files={};applyLook();render();return}
  if(a==="hg"){SET.hgFoto=el.dataset.v==="foto";saveSet();applyLook();render();if(SET.hgFoto)getBlob("hintergrund").then(function(bl){if(!bl)toast("Jetzt „Foto wählen“ tippen.")});return}
  if(a==="reflex"){SET.reflex=!SET.reflex;saveSet();if(SET.reflex)startReflex(true);else setLight(25,0);render();return}
  if(a==="filt"){S.filter=el.dataset.f;if(view().name==="liste"){ev.preventDefault();render()}return}
  if(a==="gps"){startGps();toast("Standort wird ermittelt …");render();return}
  if(a==="start"){startVisit(el.dataset.bw);return}
  if(a==="saveBw"){var old=el.dataset.id?S.bw[el.dataset.id]:null,b=readEdit(old);if(!b)return;saveB(b).then(function(){toast("Gespeichert");location.hash="#bw-"+b.id});return}
  if(a==="delBw"){if(!confirmTap(el,"Wirklich löschen? Alle Besichtigungen und Fotos dazu gehen verloren. Nochmal tippen"))return;deleteBw(el.dataset.id).then(function(){toast("Bauwerk gelöscht");location.hash="#liste"});return}
  if(a==="setCoord"&&S.pos){var bb=S.bw[el.dataset.bw];bb.lat=S.pos.lat;bb.lon=S.pos.lon;saveB(bb);toast("Position gespeichert (± "+Math.round(S.pos.acc)+" m)");render();return}
  if(a==="viewRef"){viewRef(el.dataset.bw);return}
  if(a==="clearRef"){var br=S.bw[el.dataset.bw];br.refKey=null;br.refHeading=null;saveB(br);closeModal();render();return}
  if(a==="setRef"){var bs=S.bw[el.dataset.bw],fk=el.dataset.key,meta=null;Object.keys(S.visits).forEach(function(v){S.visits[v].fotos.forEach(function(ff){if(ff.key===fk)meta=ff})});bs.refKey=fk;bs.refHeading=meta&&meta.heading;saveB(bs);toast("Als Vergleichsbild gespeichert");closeModal();render();return}
  if(a==="closeModal"){closeModal();return}
  if(a==="camOpen"){camOpen(id);return}
  if(a==="camClose"){camClose();return}
  if(a==="shoot"){shoot();return}
  if(a==="ctag"){S.tag=el.dataset.t;document.querySelectorAll("#ctags button").forEach(function(b2){b2.setAttribute("aria-pressed",String(b2.dataset.t===S.tag))});return}
  if(a==="refToggle"){var ri=$("refimg");ri.hidden=!ri.hidden;$("opWrap").hidden=ri.hidden;return}
  if(a==="backup"){backup();return}
  if(a==="wipe"){if(!confirmTap(el,"Wirklich ALLES löschen? Nochmal tippen"))return;wipe();return}
  if(!x)return;
  if(a==="viewFoto"){viewFoto(id,+el.dataset.i);return}
  if(a==="delFoto"){if(!confirmTap(el,"Wirklich löschen?"))return;var f=x.fotos.splice(+el.dataset.i,1)[0];delBlob(f.key);var bf=S.bw[x.bw];if(bf.refKey===f.key){bf.refKey=null;saveB(bf)}saveV(x);closeModal();render();return}
  if(a==="delAudio"){if(!confirmTap(el,"Sicher?"))return;var au=x.audios.splice(+el.dataset.i,1)[0];delBlob(au.key);saveV(x);render();return}
  if(a==="preview"){preview(x);return}
  if(a==="pp"){var i=+el.dataset.i;x.ja[i]=!x.ja[i];saveV(x);render();return}
  if(a==="sonder"){x.sonder=!x.sonder;saveV(x);render();return}
  if(a==="reset"){x.ja=x.ref.slice();x.sonder=false;saveV(x);render();return}
  if(a==="rec"){recToggle(id);return}
  if(a==="dict"){dictToggle(id,el.dataset.k);return}
  if(a==="finish"){if(S.dict){S.dict.rec.stop();S.dict=null}finishVisit(x).then(function(){render();scrollTo({top:document.body.scrollHeight,behavior:"smooth"})});return}
  if(a==="reopen"){reopenVisit(x).then(render);return}
  if(a==="share"){share(x);return}
  if(a==="dlProt"){exportFiles(x,"prot").then(dlAll).catch(function(e){toast("Fehler: "+e.message)});return}
  if(a==="dlFotos"){exportFiles(x,"fotos").then(dlAll);return}
  if(a==="dlZip"){dlZip(x);return}
  if(a==="delVisit"){if(!confirmTap(el,"Wirklich löschen? Nochmal tippen"))return;
    var bv=S.bw[x.bw];if(x.status==="abgeschlossen"&&bv.letzte&&bv.letzte.datum===x.datum){bv.letzte=x.basisLetzte||null;saveB(bv)}
    Promise.all(x.fotos.map(function(f){return delBlob(f.key)}).concat(x.audios.map(function(f){return delBlob(f.key)}))).then(function(){return del("visits",x.id)}).then(function(){delete S.visits[x.id];render()});return}
});
document.addEventListener("change",function(ev){
  var el=ev.target;
  if(el.matches("textarea[data-k]")){var x=S.visits[el.dataset.visit];if(x){x[el.dataset.k]=el.value;saveV(x)}return}
  if(el.id==="s_pruefer"){SET.pruefer=el.value.trim()||"Dogan";saveSet();toast("Gespeichert");return}
  if(el.id==="bez"){S.bez=el.value;$("results").innerHTML=resultsHtml();return}
  if(el.id==="csvIn"&&el.files[0]){importCsv(el.files[0]);el.value="";return}
  if(el.id==="restoreIn"&&el.files[0]){restore(el.files[0]);el.value="";return}
  if(el.id==="hgIn"&&el.files[0]){var hf=el.files[0];el.value="";fileToJpeg(hf,2200).then(function(bl){return putBlob("hintergrund",bl)}).then(function(){SET.hgFoto=true;saveSet();applyLook();toast("Hintergrund gesetzt")}).catch(function(){toast("Foto konnte nicht gelesen werden.")});return}
  if(el.dataset.gal&&el.files.length){var x2=S.visits[el.dataset.gal],fs=Array.from(el.files);el.value="";toast("Fotos werden übernommen …");
    fs.reduce(function(p,f){return p.then(function(){return fileToJpeg(f).then(function(bl){return addFoto(x2,bl,{quelle:"Galerie"})})})},Promise.resolve()).then(render);return}
  if(el.dataset.ref&&el.files[0]){var bw=S.bw[el.dataset.ref],f=el.files[0];el.value="";fileToJpeg(f).then(function(bl){var k="ref_"+bw.id+"_"+Date.now();return putBlob(k,bl).then(function(){bw.refKey=k;bw.refHeading=null;return saveB(bw)})}).then(function(){toast("Altes Bild gespeichert");render()});return}
});
document.addEventListener("input",function(ev){
  var el=ev.target;
  if(el.id==="op"){setOp();return}
  if(el.id==="q"){S.q=el.value;$("results").innerHTML=resultsHtml();return}
  if(el.id==="cmpR"){var p=el.value;$("cmpOver").style.clipPath="inset(0 0 0 "+p+"%)";$("cmpLine").style.left=p+"%";return}
});
document.addEventListener("focusin",function(e){if(e.target.id==="q")S.typing=true});
document.addEventListener("focusout",function(e){if(e.target.id==="q")S.typing=false});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("modal").hidden)closeModal()});
window.addEventListener("hashchange",function(){if(!$("cam").hidden)camClose();closeModal();render();scrollTo({top:0})});
window.addEventListener("orientationchange",updLevel);

/* ---------- Start ---------- */
function seed(){if(ls("seeded",false))return Promise.resolve();return Promise.all(SEED.map(function(b){return S.bw[b.id]?null:saveB(JSON.parse(JSON.stringify(b)))})).then(function(){lss("seeded",true)})}
function migrateOld(){ // Daten der ersten Demo-Version übernehmen (Positionen, Vergleichsbilder, abgeschlossene Besichtigungen)
  var c=ls("coords",{}),r=ls("refs",{});Object.keys(c).forEach(function(k){if(S.bw[k]&&S.bw[k].lat==null&&c[k]){S.bw[k].lat=c[k][0];S.bw[k].lon=c[k][1];saveB(S.bw[k])}});
  Object.keys(r).forEach(function(k){if(r[k]&&S.bw[k]&&!S.bw[k].refKey){S.bw[k].refKey=r[k];saveB(S.bw[k])}});
  Object.keys(S.visits).forEach(function(id){var v=S.visits[id];if(!v.audios)v.audios=[];if(v.status==="abgeschlossen"&&S.bw[v.bw]&&(!S.bw[v.bw].letzte||S.bw[v.bw].letzte.datum<v.datum)){v.basisLetzte=v.basisLetzte||S.bw[v.bw].letzte;S.bw[v.bw].letzte={datum:v.datum,pruefer:v.pruefer,ja:v.ja.slice(),verunreinigungen:v.verunreinigungen,schaden:v.schaden,sonstige:v.sonstige};saveB(S.bw[v.bw]);saveV(v)}});
}
dbOpen().then(function(){return Promise.all([all("bauwerke"),all("visits")])}).then(function(r){
  (r[0]||[]).forEach(function(b){S.bw[b.id]=b});(r[1]||[]).forEach(function(v){S.visits[v.id]=v});
  return seed().then(function(){if(!ls("migrated3",false)){migrateOld();lss("migrated3",true)}});
}).then(function(){applyLook();startReflex(false);render()}).catch(function(e){$("app").innerHTML='<div class="glass empty">Speicher nicht verfügbar (privates Fenster?). Bitte normal öffnen.</div>';console.error(e)});
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(function(){});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
</script>
