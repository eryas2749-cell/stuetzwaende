  if(a==="arcDel"){if(!confirmTap(el,"Wirklich löschen?"))return;var db=S.bw[el.dataset.bw],dk=el.dataset.key,da=arcFind(db,dk);if(!da)return;db.archiv=arcOf(db).filter(function(z){return z.key!==dk});if(db.refKey===dk){db.refKey=null;db.refDriveId=null}
    if(da.driveId)queueTrash(da.driveId);delete SY.ob.blobs[dk];saveOb();delBlob(dk);saveB(db);S.arcOpen=db.id;closeModal();render();toast("Gelöscht");return}
  if(a==="clearRef"){var br=S.bw[el.dataset.bw];if(br.refKey&&/^ref_/.test(br.refKey)){queueTrash(br.refDriveId);delBlob(br.refKey)}br.refKey=null;br.refHeading=null;br.refDriveId=null;saveB(br);closeModal();render();return}
  if(a==="setRef"){var bs=S.bw[el.dataset.bw],fk=el.dataset.key,meta=null;Object.keys(S.visits).forEach(function(v){S.visits[v].fotos.forEach(function(ff){if(ff.key===fk)meta=ff})});if(bs.refKey&&/^ref_/.test(bs.refKey)){queueTrash(bs.refDriveId);delBlob(bs.refKey)}bs.refKey=fk;bs.refHeading=meta&&meta.heading;bs.refDriveId=meta&&meta.driveId||null;saveB(bs);toast("Als Vergleichsbild gespeichert");closeModal();render();return}
  if(a==="vfDl"){if(S.vf)dlAll(S.vf);return}
  if(a==="vfShare"){if(S.vf&&navigator.share)navigator.share({files:S.vf}).catch(function(e){if(e&&e.name!=="AbortError")toast("Teilen nicht möglich")});return}
  if(a==="closeModal"){closeModal();return}
  if(a==="camOpen"){camOpen(id);return}
  if(a==="camClose"){camClose();return}
  if(a==="shoot"){shoot();return}
  if(a==="ctag"){S.tag=el.dataset.t;document.querySelectorAll("#ctags button").forEach(function(b2){b2.setAttribute("aria-pressed",String(b2.dataset.t===S.tag))});return}
  if(a==="refToggle"){var ri=$("refimg");ri.hidden=!ri.hidden;$("opWrap").hidden=ri.hidden;return}
  if(a==="backup"){backup();return}
  if(a==="saveArt"){saveArt(el.dataset.id);return}
  if(a==="delArt"){if(!confirmTap(el,"Wirklich löschen? Nochmal tippen"))return;ORG.types=ORG.types.filter(function(t){return t.id!==el.dataset.id});saveOrg();location.hash="#einst";return}
  if(a==="login"){login(false);return}
  if(a==="logout"){if(!confirmTap(el,"Wirklich abmelden? Nochmal tippen"))return;logout();render();return}
  if(a==="syncNow"){if(!tokOk()){login(false);return}syncNow();return}
  if(a==="wipe"){if(!confirmTap(el,"Wirklich ALLES löschen? Nochmal tippen"))return;wipe();return}
  if(!x)return;
  if(a==="viewFoto"){viewFoto(id,+el.dataset.i);return}
  if(a==="delFoto"){if(!confirmTap(el,"Wirklich löschen?"))return;var f=x.fotos.splice(+el.dataset.i,1)[0];delBlob(f.key);x.del=(x.del||[]).concat(f.key);queueTrash(f.driveId);delete SY.ob.blobs[f.key];saveOb();var bf=S.bw[x.bw];if(bf.refKey===f.key){bf.refKey=null;bf.refDriveId=null;saveB(bf)}saveV(x);closeModal();render();return}
  if(a==="delAudio"){if(!confirmTap(el,"Sicher?"))return;var au=x.audios.splice(+el.dataset.i,1)[0];delBlob(au.key);x.del=(x.del||[]).concat(au.key);queueTrash(au.driveId);delete SY.ob.blobs[au.key];saveOb();saveV(x);render();return}
  if(a==="preview"){preview(x,el.dataset.f==="1");return}
  if(a==="pp"){var i=+el.dataset.i;x.ja[i]=!x.ja[i];saveV(x);render();return}
  if(a==="ppSet"){var i2=+el.dataset.i,nv=el.dataset.v==="1";if(x.ja[i2]!==nv){x.ja[i2]=nv;saveV(x);render()}return}
  if(a==="sonderSet"){var sv=el.dataset.v==="1";if(x.sonder!==sv){x.sonder=sv;saveV(x);render()}return}
  if(a==="sonder"){x.sonder=!x.sonder;saveV(x);render();return}
  if(a==="reset"){x.ja=x.ref.slice();x.sonder=false;saveV(x);render();return}
  if(a==="rec"){recToggle(id);return}
  if(a==="dict"){dictToggle(id,el.dataset.k);return}
  if(a==="finish"){if(S.dict){S.dict.rec.stop();S.dict=null}S.show=S.show||{};S.show[x.bw]=x.id;finishVisit(x).then(function(){render();var e=$("protPanel");if(e)e.scrollIntoView({behavior:"smooth",block:"start"})});return}
  if(a==="reopen"){reopenVisit(x).then(render);return}
  if(a==="editLast"){if(S.show)delete S.show[x.bw];reopenVisit(x).then(function(){closeModal&&$("modal")&&!$("modal").hidden&&closeModal();location.hash="#bw-"+x.bw;render();scrollTo(0,0);toast("Besichtigung vom "+deDate(x.datum)+" wieder geöffnet")});return}
  if(a==="share"){share(x);return}
  if(a==="dlPdf"){dlPdf(x,el.dataset.f==="1");return}
  if(a==="dlProt"){exportFiles(x,"prot").then(function(fs){showFiles(fs,{title:"Excel-Protokoll",html:protWrap(x,false)})}).catch(function(e){toast("Fehler: "+e.message)});return}
  if(a==="dlFotos"){exportFiles(x,"fotos").then(function(fs){showFiles(fs,{title:"Fotos ("+fs.length+")"})}).catch(function(e){toast("Fehler: "+e.message)});return}
  if(a==="dlZip"){dlZip(x);return}
  if(a==="delVisit"){if(!confirmTap(el,"Wirklich löschen? Nochmal tippen"))return;
    var bv=S.bw[x.bw];if(x.status==="abgeschlossen"&&bv.letzte&&bv.letzte.datum===x.datum){bv.letzte=x.basisLetzte||null;saveB(bv)}
    x.fotos.concat(x.audios).forEach(function(f){queueTrash(f.driveId);delete SY.ob.blobs[f.key]});queueTrash(x.protDriveId);delete SY.ob.prot[x.id];tombstone("v:"+x.id);
    Promise.all(x.fotos.map(function(f){return delBlob(f.key)}).concat(x.audios.map(function(f){return delBlob(f.key)}))).then(function(){return del("visits",x.id)}).then(function(){delete S.visits[x.id];render()});return}
});
document.addEventListener("change",function(ev){
  var el=ev.target;
  if(el.matches("textarea[data-k]")){var x=S.visits[el.dataset.visit];if(x){x[el.dataset.k]=el.value;saveV(x)}return}
  if(el.id==="s_pruefer"){SET.pruefer=el.value.trim()||"Dogan";saveSet();toast("Gespeichert");return}
  if(el.id==="e_art"){var gl=$("grpLbl");if(gl)gl.textContent=grp(typeById(el.value));return}
  if(el.dataset.eig!=null){var eb=S.bw[el.dataset.eig];if(eb){eb.eigentum=el.value.trim();saveB(eb);el.style.boxShadow=eb.eigentum?"":"inset 0 0 0 2px var(--warn)";toast("Eigentümer gespeichert")}return}
  if(el.dataset.org!=null){ORG[el.dataset.org]=el.value.trim();saveOrg();toast("Gespeichert");return}
  if(el.id==="csvIn"&&el.files[0]){importCsv(el.files[0]);el.value="";return}
  if(el.id==="impFile"&&el.files[0]){impFile(el.files[0]);el.value="";return}
  if(el.id==="arcJahr"){S.arcJahr=el.value;return}
  if(el.hasAttribute&&el.hasAttribute("data-opt-tilt")){SET.tilt=el.checked;saveSet();if(SET.tilt)startReflex(true);return}
  if((el.dataset.arcfoto||el.dataset.arcdoc)&&el.files.length){var arb=S.bw[el.dataset.arcfoto||el.dataset.arcdoc],fl=Array.prototype.slice.call(el.files);el.value="";S.arcOpen=arb.id;arcAdd(arb,fl,el.dataset.arcfoto?"foto":"datei");return}
  if(el.dataset.map&&S.imp){S.imp.map[el.dataset.map]=+el.value;render();return}
  if(el.dataset.imp==="art"&&S.imp){if(el.value==="__neu"){S.retImport=true;location.hash="#art-neu";return}S.imp.art=el.value;render();return}
  if(el.dataset.imp==="letter"&&S.imp){S.imp.letter=el.checked;render();return}
  if(el.id==="restoreIn"&&el.files[0]){restore(el.files[0]);el.value="";return}
  if(el.id==="hgIn"&&el.files[0]){var hf=el.files[0];el.value="";fileToJpeg(hf,2200).then(function(bl){return putBlob("hintergrund",bl)}).then(function(){SET.hgFoto=true;saveSet();applyLook();toast("Hintergrund gesetzt")}).catch(function(){toast("Foto konnte nicht gelesen werden.")});return}
  if(el.dataset.gal&&el.files.length){var x2=S.visits[el.dataset.gal],fs=Array.from(el.files);el.value="";toast("Fotos werden übernommen …");
    fs.reduce(function(p,f){return p.then(function(){return fileToJpeg(f).then(function(bl){return addFoto(x2,bl,{quelle:"Galerie"})})})},Promise.resolve()).then(render);return}
  if(el.dataset.ref&&el.files[0]){var bw=S.bw[el.dataset.ref],f=el.files[0];el.value="";fileToJpeg(f).then(function(bl){var k="ref_"+bw.id+"_"+Date.now();return putBlob(k,bl).then(function(){if(bw.refKey&&/^ref_/.test(bw.refKey)){queueTrash(bw.refDriveId);delBlob(bw.refKey)}bw.refKey=k;bw.refHeading=null;bw.refDriveId=null;queueBlob(k,"bw:"+bw.id,bw.id,bw.nr+"_Vergleichsbild.jpg");return saveB(bw)})}).then(function(){toast("Altes Bild gespeichert");render()});return}
});
document.addEventListener("input",function(ev){
  var el=ev.target;
  if(el.id==="op"){setOp();return}
  if(el.id==="q"){S.q=el.value;$("results").innerHTML=resultsHtml();return}
  if(el.id==="cmpR"){var p=el.value;$("cmpOver").style.clipPath="inset(0 0 0 "+p+"%)";$("cmpLine").style.left=p+"%";return}
});
document.addEventListener("focusin",function(e){if(e.target.id==="q")S.typing=true});
document.addEventListener("focusout",function(e){if(e.target.id==="q")S.typing=false});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("modal").hidden)closeModal()});
window.addEventListener("hashchange",function(){lookOpen(false);if(!$("cam").hidden)camClose();closeModal();render();scrollTo({top:0})});
window.addEventListener("orientationchange",updLevel);

/* ---------- Start ---------- */
function seed(){if(ls("seeded",false))return Promise.resolve();return Promise.all(SEED.map(function(b){return S.bw[b.id]?null:saveB(JSON.parse(JSON.stringify(b)),true)})).then(function(){lss("seeded",true)})}
function migrateOld(){ // Daten der ersten Demo-Version übernehmen (Positionen, Vergleichsbilder, abgeschlossene Besichtigungen)
  var c=ls("coords",{}),r=ls("refs",{});Object.keys(c).forEach(function(k){if(S.bw[k]&&S.bw[k].lat==null&&c[k]){S.bw[k].lat=c[k][0];S.bw[k].lon=c[k][1];saveB(S.bw[k])}});
  Object.keys(r).forEach(function(k){if(r[k]&&S.bw[k]&&!S.bw[k].refKey){S.bw[k].refKey=r[k];saveB(S.bw[k])}});
  Object.keys(S.visits).forEach(function(id){var v=S.visits[id];if(!v.audios)v.audios=[];if(v.status==="abgeschlossen"&&S.bw[v.bw]&&(!S.bw[v.bw].letzte||S.bw[v.bw].letzte.datum<v.datum)){v.basisLetzte=v.basisLetzte||S.bw[v.bw].letzte;S.bw[v.bw].letzte={datum:v.datum,pruefer:v.pruefer,ja:v.ja.slice(),verunreinigungen:v.verunreinigungen,schaden:v.schaden,sonstige:v.sonstige};saveB(S.bw[v.bw]);saveV(v)}});
}
dbOpen().then(function(){return Promise.all([all("bauwerke"),all("visits")])}).then(function(r){
  (r[0]||[]).forEach(function(b){S.bw[b.id]=b});(r[1]||[]).forEach(function(v){S.visits[v.id]=v});
  return seed().then(function(){if(!ls("migrated3",false)){migrateOld();lss("migrated3",true)}});
}).then(function(){applyLook();applyOrg();startReflex(false);render();startSync()}).catch(function(e){$("app").innerHTML='<div class="glass empty">Speicher nicht verfügbar (privates Fenster?). Bitte normal öffnen.</div>';console.error(e)});
function startSync(){updSync();
  if(SY.justIn)toast("Mit Google verbunden – Daten werden abgeglichen …",3500);
  if(SY.on){if(tokOk())syncNow();else{SY.needLogin=true;updSync();maybeSilent()}}
  setInterval(function(){if(document.visibilityState==="visible")syncNow()},30000);
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"){if(tokOk())syncNow();else maybeSilent()}});
  window.addEventListener("online",function(){syncNow()});
}
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(function(){});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
