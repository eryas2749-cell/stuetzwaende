/* Layout: eine Spalte aus Glasflächen über einem lebendigen Hintergrund (Farbfelder oder eigenes Foto); Systemschrift, läuft offline. */
:root{

}

  --fg:#EEF1F6; --muted:#B9C1CF; --field:rgba(255,255,255,.08); --line:rgba(255,255,255,.14); --shadow:0 14px 36px rgba(0,0,0,.40);
  --ok:#86CFA6; --warn:#E3B872; --bad:#EE9090; --okbg:rgba(134,207,166,.16); --warnbg:rgba(227,184,114,.16); --badbg:rgba(238,144,144,.18);

  --fg:#EEF1F6; --muted:#B9C1CF; --field:rgba(255,255,255,.08); --line:rgba(255,255,255,.14); --shadow:0 14px 36px rgba(0,0,0,.40);
  --ok:#86CFA6; --warn:#E3B872; --bad:#EE9090; --okbg:rgba(134,207,166,.16); --warnbg:rgba(227,184,114,.16); --badbg:rgba(238,144,144,.18);
  --bgfx-op:.9; color-scheme:dark;
}

:root[data-theme="dark"][data-bg="sand"]{--b1:#8A4A22;--b2:#86323C;--b3:#6E5726;--b4:#8C6A1C;--accent:#ECC0A6;--on-accent:#1A120E}
:root[data-theme="dark"][data-bg="lavendel"]{--b1:#53389A;--b2:#8C3570;--b3:#2D4F9A;--b4:#5E449A;--accent:#CDBFF0;--on-accent:#15111F}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--f);-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(100px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
/* Hintergrund: Farbfelder (scharf genug, damit das Glas etwas zu brechen hat) oder eigenes Foto */
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--bg) center/cover no-repeat}
.bgfx i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(36px);opacity:var(--bgfx-op);will-change:transform}

.bgfx i:nth-child(2){background:var(--b2);right:-22vmax;top:12vmax;animation:d2 30s ease-in-out infinite alternate}
.bgfx i:nth-child(3){background:var(--b3);left:-8vmax;bottom:-26vmax;animation:d3 27s ease-in-out infinite alternate}
.bgfx i:nth-child(4){background:var(--b4);right:-14vmax;bottom:-30vmax;width:44vmax;height:44vmax;animation:d1 35s ease-in-out infinite alternate-reverse}
.bgfx i:nth-child(5){background:var(--b2);left:30vw;top:38vh;width:26vmax;height:26vmax;filter:blur(22px);animation:d2 21s ease-in-out infinite alternate-reverse}
.bgfx::after{content:"";position:absolute;inset:0;background:var(--scrim)}
.bgfx.foto i{display:none}
@keyframes d1{to{transform:translate(18vmax,14vmax) scale(1.2)}}
@keyframes d2{to{transform:translate(-16vmax,18vmax) scale(.9)}}
@keyframes d3{to{transform:translate(14vmax,-16vmax) scale(1.15)}}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
/* Liquid Glass: wenig Unschärfe, starke Sättigung, helle Kante, Lichtreflex (folgt optional der Neigung) */
.glass{position:relative;background-color:rgba(var(--gbase),var(--galpha));
  background-image:radial-gradient(140% 90% at var(--lx) var(--ly),var(--spec),transparent 55%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat)) brightness(1.04);backdrop-filter:blur(var(--blur)) saturate(var(--sat)) brightness(1.04);
  border:0;border-radius:26px;
  box-shadow:inset 0 1px 0 var(--rim),inset 1px 0 0 var(--rim2),inset -1px 0 0 var(--rim2),inset 0 -1px 0 var(--rim2),inset 0 0 22px rgba(255,255,255,.07),var(--shadow)}
.glass.panel,.glass.card,.glass.empty{background-color:rgba(var(--gbase),calc(var(--galpha) + .16))}
header.top{position:sticky;top:max(8px,env(safe-area-inset-top,0px));z-index:5;margin:10px auto 0;max-width:640px;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px}
.brand{flex:1;min-width:0;display:flex;flex-direction:column}
.eyebrow{font:600 11px/1.3 var(--f);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:19px} #title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} @media (max-width:420px){#title{font-size:17px}} h2{font-size:22px} h3{font-size:16px}
.ibtn{flex-shrink:0;width:44px;height:44px;border-radius:22px;border:0;background:rgba(var(--gbase),.35);box-shadow:inset 0 1px 0 var(--rim),inset 0 -1px 0 var(--rim2);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ibtn.sync{position:relative}
.ibtn.sync i{position:absolute;right:7px;bottom:8px;width:10px;height:10px;border-radius:5px;background:var(--muted);box-shadow:0 0 0 2px rgba(var(--gbase),.9)}
.ibtn.sync[data-st="ok"] i{background:var(--ok)}

nav.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;width:min(420px,calc(100vw - 32px));display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:6px;border-radius:34px}

.btn{font:600 16px var(--f);min-height:50px;padding:0 18px;border-radius:25px;border:0;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.12),0 4px 14px rgba(0,0,0,.12);position:relative;overflow:hidden}

.btn.block{width:100%} .btn.sm{min-height:42px;font-size:14px;padding:0 14px}

.card{display:flex;gap:12px;padding:14px;align-items:flex-start;text-decoration:none;color:inherit}
.card .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.card .nr{font:600 12px var(--f);color:var(--muted);letter-spacing:.04em}
.card .name{font-weight:650;font-size:17px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{padding:14px;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:inherit}
.tile b{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.bar{height:8px;border-radius:4px;background:var(--field);overflow:hidden;border:1px solid var(--line)}

.kv span:first-child{font-size:12px;color:var(--muted)} .kv span:last-child{font-weight:600}
.alert{border-radius:18px;padding:12px 14px;font-size:14px;-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.alert.warn{background:var(--warnbg)} .alert.bad{background:var(--badbg)} .alert.info{background:var(--field);border:1px solid var(--line)}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph{display:flex;flex-direction:column;gap:3px;min-width:0;border:0;background:none;padding:0;color:inherit;text-align:left;cursor:pointer;font:inherit}

.pp{display:flex;flex-direction:column}

.pp-row:first-child{border-top:0}

.pp-h.chg{color:var(--warn)}
.sw{width:52px;height:32px;border-radius:16px;border:1px solid var(--line);background:var(--field);position:relative;flex-shrink:0;cursor:pointer;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sw[aria-pressed="true"]{background:var(--warn);border-color:transparent}
.sw.vs[aria-pressed="true"],.sw.on[aria-pressed="true"]{background:var(--ok)}
.sw.sp[aria-pressed="true"]{background:var(--bad)}
.sw[aria-pressed="true"]::after{left:23px}
label.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.fldrow{display:flex;gap:6px;align-items:flex-start}
textarea,input[type=search],input[type=text],input[type=number],input[type=date],select{font:16px var(--f);color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;min-height:46px}
textarea{resize:vertical;min-height:70px}

function hydrate(){
  document.querySelectorAll("img[data-key],audio[data-key]").forEach(function(el){

  startGps();
  try{if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==="function")DeviceOrientationEvent.requestPermission().then(function(s){if(s==="granted")listenOri()}).catch(function(){});else listenOri()}catch(e){}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast("Kamera nicht verfügbar – bitte „Fotos aus Galerie“ nutzen.");return}

    .catch(function(){toast("Kamera nicht erlaubt. In den Einstellungen des Handys freigeben oder „Fotos aus Galerie“ nutzen.",4000);camClose()});

function camClose(){if(CAM.stream)CAM.stream.getTracks().forEach(function(t){t.stop()});CAM.stream=null;$("cam").hidden=true;document.body.style.overflow="";render()}

    var r=new MediaRecorder(st,mime?{mimeType:mime}:{}),parts=[],t0=Date.now();S.rec=r;S.recSec=0;
    S.recTimer=setInterval(function(){S.recSec=Math.round((Date.now()-t0)/1000);var bt=document.querySelector('[data-act="rec"]');if(bt)bt.textContent="Aufnahme beenden ("+S.recSec+" s)"},1000);

    r.onstop=function(){clearInterval(S.recTimer);st.getTracks().forEach(function(t){t.stop()});S.rec=null;
      var bl=new Blob(parts,{type:r.mimeType||mime||"audio/webm"}),x=S.visits[id],key="audio_"+id+"_"+Date.now();
      putBlob(key,bl).then(function(){var au={key:key,zeit:hm(),dauer:Math.round((Date.now()-t0)/1000),mime:bl.type,ts:new Date().toISOString()};x.audios.push(au);queueBlob(key,"v:"+x.id,x.bw,audioName(x,au));return saveV(x)}).then(render)};

  if(a==="setRef"){var bs=S.bw[el.dataset.bw],fk=el.dataset.key,meta=null;Object.keys(S.visits).forEach(function(v){S.visits[v].fotos.forEach(function(ff){if(ff.key===fk)meta=ff})});if(bs.refKey&&!/^foto_/.test(bs.refKey)){queueTrash(bs.refDriveId);delBlob(bs.refKey)}bs.refKey=fk;bs.refHeading=meta&&meta.heading;bs.refDriveId=meta&&meta.driveId||null;saveB(bs);toast("Als Vergleichsbild gespeichert");closeModal();render();return}
  if(a==="closeModal"){closeModal();return}
  if(a==="camOpen"){camOpen(id);return}
  if(a==="camClose"){camClose();return}
  if(a==="shoot"){shoot();return}
  if(a==="ctag"){S.tag=el.dataset.t;document.querySelectorAll("#ctags button").forEach(function(b2){b2.setAttribute("aria-pressed",String(b2.dataset.t===S.tag))});return}
  if(a==="refToggle"){var ri=$("refimg");ri.hidden=!ri.hidden;$("opWrap").hidden=ri.hidden;return}
  if(a==="backup"){backup();return}
  if(a==="saveArt"){saveArt(el.dataset.id);return}
  if(a==="delArt"){if(!confirmTap(el,"Wirklich löschen? Nochmal tippen"))return;ORG.types=ORG.types.filter(function(t){return t.id!==el.dataset.id});saveOrg();location.hash="#einst";return}
  if(a==="login"){login(false);return}
  if(a==="logout"){if(!confirmTap(el,"Wirklich abmelden? Nochmal tippen"))return;logout();render();return}
  if(a==="syncNow"){if(!tokOk()){login(false);return}syncNow();return}
  if(a==="wipe"){if(!confirmTap(el,"Wirklich ALLES löschen? Nochmal tippen"))return;wipe();return}
  if(!x)return;
  if(a==="viewFoto"){viewFoto(id,+el.dataset.i);return}
  if(a==="delFoto"){if(!confirmTap(el,"Wirklich löschen?"))return;var f=x.fotos.splice(+el.dataset.i,1)[0];delBlob(f.key);x.del=(x.del||[]).concat(f.key);queueTrash(f.driveId);delete SY.ob.blobs[f.key];saveOb();var bf=S.bw[x.bw];if(bf.refKey===f.key){bf.refKey=null;bf.refDriveId=null;saveB(bf)}saveV(x);closeModal();render();return}
  if(a==="delAudio"){if(!confirmTap(el,"Sicher?"))return;var au=x.audios.splice(+el.dataset.i,1)[0];delBlob(au.key);x.del=(x.del||[]).concat(au.key);queueTrash(au.driveId);delete SY.ob.blobs[au.key];saveOb();saveV(x);render();return}
  if(a==="preview"){preview(x);return}
  if(a==="pp"){var i=+el.dataset.i;x.ja[i]=!x.ja[i];saveV(x);render();return}
  if(a==="sonder"){x.sonder=!x.sonder;saveV(x);render();return}
  if(a==="setArt"){x.art=el.dataset.v;saveV(x);render();return}
  if(a==="reset"){x.ja=x.ref.slice();x.sonder=false;saveV(x);render();return}
  if(a==="rec"){recToggle(id);return}
  if(a==="dict"){dictToggle(id,el.dataset.k);return}
  if(a==="finish"){if(S.dict){S.dict.rec.stop();S.dict=null}finishVisit(x).then(function(){render();scrollTo({top:document.body.scrollHeight,behavior:"smooth"})});return}
  if(a==="reopen"){reopenVisit(x).then(render);return}
  if(a==="share"){share(x);return}
  if(a==="dlProt"){exportFiles(x,"prot").then(dlAll).catch(function(e){toast("Fehler: "+e.message)});return}
  if(a==="dlFotos"){exportFiles(x,"fotos").then(dlAll);return}
  if(a==="dlZip"){dlZip(x);return}
  if(a==="delVisit"){if(!confirmTap(el,"Wirklich löschen? Nochmal tippen"))return;
    var bv=S.bw[x.bw];if(x.status==="abgeschlossen"&&bv.letzte&&bv.letzte.datum===x.datum){bv.letzte=x.basisLetzte||null;saveB(bv)}
    x.fotos.concat(x.audios).forEach(function(f){queueTrash(f.driveId);delete SY.ob.blobs[f.key]});queueTrash(x.protDriveId);delete SY.ob.prot[x.id];tombstone("v:"+x.id);
    Promise.all(x.fotos.map(function(f){return delBlob(f.key)}).concat(x.audios.map(function(f){return delBlob(f.key)}))).then(function(){return del("visits",x.id)}).then(function(){delete S.visits[x.id];render()});return}
});
document.addEventListener("change",function(ev){
  var el=ev.target;
  if(el.matches("textarea[data-k]")){var x=S.visits[el.dataset.visit];if(x){x[el.dataset.k]=el.value;saveV(x)}return}
  if(el.id==="s_pruefer"){SET.pruefer=el.value.trim()||"Dogan";saveSet();toast("Gespeichert");return}
  if(el.id==="bez"){S.bez=el.value;$("results").innerHTML=resultsHtml();return}
  if(el.id==="artF"){S.art=el.value;$("results").innerHTML=resultsHtml();return}
  if(el.dataset.org!=null){ORG[el.dataset.org]=el.value.trim();saveOrg();toast("Gespeichert");if(el.dataset.org==="gebiet")render();return}
  if(el.dataset.int!=null){ORG.intervalle[el.dataset.int]=Math.max(0,parseInt(el.value,10)||0);saveOrg();toast("Gespeichert");return}
  if(el.id==="csvIn"&&el.files[0]){importCsv(el.files[0]);el.value="";return}
  if(el.id==="restoreIn"&&el.files[0]){restore(el.files[0]);el.value="";return}
  if(el.id==="hgIn"&&el.files[0]){var hf=el.files[0];el.value="";fileToJpeg(hf,2200).then(function(bl){return putBlob("hintergrund",bl)}).then(function(){SET.hgFoto=true;saveSet();applyLook();toast("Hintergrund gesetzt")}).catch(function(){toast("Foto konnte nicht gelesen werden.")});return}
  if(el.dataset.gal&&el.files.length){var x2=S.visits[el.dataset.gal],fs=Array.from(el.files);el.value="";toast("Fotos werden übernommen …");
    fs.reduce(function(p,f){return p.then(function(){return fileToJpeg(f).then(function(bl){return addFoto(x2,bl,{quelle:"Galerie"})})})},Promise.resolve()).then(render);return}
  if(el.dataset.ref&&el.files[0]){var bw=S.bw[el.dataset.ref],f=el.files[0];el.value="";fileToJpeg(f).then(function(bl){var k="ref_"+bw.id+"_"+Date.now();return putBlob(k,bl).then(function(){if(bw.refKey&&!/^foto_/.test(bw.refKey)){queueTrash(bw.refDriveId);delBlob(bw.refKey)}bw.refKey=k;bw.refHeading=null;bw.refDriveId=null;queueBlob(k,"bw:"+bw.id,bw.id,bw.nr+"_Vergleichsbild.jpg");return saveB(bw)})}).then(function(){toast("Altes Bild gespeichert");render()});return}
});
document.addEventListener("input",function(ev){
  var el=ev.target;
  if(el.id==="op"){setOp();return}
  if(el.id==="q"){S.q=el.value;$("results").innerHTML=resultsHtml();return}
  if(el.id==="cmpR"){var p=el.value;$("cmpOver").style.clipPath="inset(0 0 0 "+p+"%)";$("cmpLine").style.left=p+"%";return}
});
document.addEventListener("focusin",function(e){if(e.target.id==="q")S.typing=true});
document.addEventListener("focusout",function(e){if(e.target.id==="q")S.typing=false});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("modal").hidden)closeModal()});
window.addEventListener("hashchange",function(){if(!$("cam").hidden)camClose();closeModal();render();scrollTo({top:0})});
window.addEventListener("orientationchange",updLevel);

/* ---------- Start ---------- */
function seed(){if(ls("seeded",false))return Promise.resolve();return Promise.all(SEED.map(function(b){return S.bw[b.id]?null:saveB(JSON.parse(JSON.stringify(b)),true)})).then(function(){lss("seeded",true)})}
function migrateOld(){ // Daten der ersten Demo-Version übernehmen (Positionen, Vergleichsbilder, abgeschlossene Besichtigungen)
  var c=ls("coords",{}),r=ls("refs",{});Object.keys(c).forEach(function(k){if(S.bw[k]&&S.bw[k].lat==null&&c[k]){S.bw[k].lat=c[k][0];S.bw[k].lon=c[k][1];saveB(S.bw[k])}});
  Object.keys(r).forEach(function(k){if(r[k]&&S.bw[k]&&!S.bw[k].refKey){S.bw[k].refKey=r[k];saveB(S.bw[k])}});
  Object.keys(S.visits).forEach(function(id){var v=S.visits[id];if(!v.audios)v.audios=[];if(v.status==="abgeschlossen"&&S.bw[v.bw]&&(!S.bw[v.bw].letzte||S.bw[v.bw].letzte.datum<v.datum)){v.basisLetzte=v.basisLetzte||S.bw[v.bw].letzte;S.bw[v.bw].letzte={datum:v.datum,pruefer:v.pruefer,ja:v.ja.slice(),verunreinigungen:v.verunreinigungen,schaden:v.schaden,sonstige:v.sonstige};saveB(S.bw[v.bw]);saveV(v)}});
}
dbOpen().then(function(){return Promise.all([all("bauwerke"),all("visits")])}).then(function(r){
  (r[0]||[]).forEach(function(b){S.bw[b.id]=b});(r[1]||[]).forEach(function(v){S.visits[v.id]=v});
  return seed().then(function(){if(!ls("migrated3",false)){migrateOld();lss("migrated3",true)}});
}).then(function(){applyLook();applyOrg();startReflex(false);render();startSync()}).catch(function(e){$("app").innerHTML='<div class="glass empty">Speicher nicht verfügbar (privates Fenster?). Bitte normal öffnen.</div>';console.error(e)});
function startSync(){updSync();
  if(SY.justIn)toast("Mit Google verbunden – Daten werden abgeglichen …",3500);
  if(SY.on){if(tokOk())syncNow();else{SY.needLogin=true;updSync();maybeSilent()}}
  setInterval(function(){if(document.visibilityState==="visible")syncNow()},30000);
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"){if(tokOk())syncNow();else maybeSilent()}});
  window.addEventListener("online",function(){syncNow()});
}
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(function(){});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
